<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Learning Bot 💕</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Lucide React icons as inline SVG components
        const Heart = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );
        
        const Sparkles = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/>
                <path d="M19 17v4"/>
                <path d="M3 5h4"/>
                <path d="M17 19h4"/>
            </svg>
        );
        
        const Send = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
            </svg>
        );
        
        const Star = ({ className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );

        function GermanLearningBot() {
          const [messages, setMessages] = useState([
            {
              role: 'assistant',
              content: 'Hallo, Liebling! 💕 I\'m here to help you learn German! Try saying "hello", ask me questions, or click the phrases below!',
            }
          ]);
          const [input, setInput] = useState('');
          const [loading, setLoading] = useState(false);
          const messagesEndRef = useRef(null);

          const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            scrollToBottom();
          }, [messages]);

          const germanResponses = {
            greetings: {
              patterns: ['hello', 'hi', 'hey', 'hallo', 'guten tag', 'guten morgen', 'guten abend'],
              responses: [
                'Hallo! 💕 (Hello!) Wie geht\'s dir? (How are you?)',
                'Hey! 🌸 Schön dich zu sehen! (Nice to see you!)',
                'Hallo, Liebling! ✨ (Hello, darling!) Wie läuft dein Tag? (How is your day going?)'
              ]
            },
            howAreYou: {
              patterns: ['how are you', 'wie geht', 'how\'s it going', 'what\'s up'],
              responses: [
                'Mir geht\'s gut, danke! 💕 (I\'m doing well, thanks!) Und dir? (And you?)',
                'Super! 🌟 Ich freue mich, dass wir Deutsch üben! (I\'m happy we\'re practicing German!)'
              ]
            },
            love: {
              patterns: ['ich liebe dich', 'i love you', 'love you'],
              responses: [
                'Ich liebe dich auch! 💕 (I love you too!) Das ist so süß! (That\'s so sweet!)',
                'Aww! 💖 "Ich liebe dich" - you said it perfectly! Das bedeutet "I love you"!'
              ]
            },
            goodMorning: {
              patterns: ['guten morgen', 'good morning', 'morning'],
              responses: [
                'Guten Morgen! ☀️ (Good morning!) Hast du gut geschlafen? (Did you sleep well?)',
                'Guten Morgen, Schatz! 💕 (Good morning, sweetheart!) Ready to learn some German?'
              ]
            },
            goodNight: {
              patterns: ['gute nacht', 'good night', 'goodnight'],
              responses: [
                'Gute Nacht! 🌙 (Good night!) Schlaf gut! (Sleep well!)',
                'Gute Nacht, Liebling! 💕 Träum was Schönes! (Sweet dreams!)'
              ]
            },
            thanks: {
              patterns: ['danke', 'thank you', 'thanks', 'vielen dank'],
              responses: [
                'Bitte schön! 💕 (You\'re welcome!) or just "Bitte!"',
                'Gern geschehen! 🌸 (My pleasure!) Keep up the great work!'
              ]
            },
            help: {
              patterns: ['help', 'hilfe', 'how do i', 'teach me', 'what does', 'was bedeutet'],
              responses: [
                'Of course! 💕 Ask me anything like "How do you say..." or "What does ___ mean?" I\'m here to help!',
                'I\'d love to help! ✨ Try asking "translate ___" or just type any German word you want to learn about!'
              ]
            },
            default: [
              'Das ist interessant! 🌸 (That\'s interesting!) Tell me more, or ask me a German question!',
              'Hmm! 💕 Try asking me to translate something, or use one of the quick phrases below!',
              'Great! ✨ Want to practice more German? Ask me "How do you say ___?" or try the phrases below!'
            ]
          };

          const getResponse = (userInput) => {
            const input = userInput.toLowerCase().trim();
            
            for (const [key, data] of Object.entries(germanResponses)) {
              if (key === 'default') continue;
              if (data.patterns.some(pattern => input.includes(pattern))) {
                return data.responses[Math.floor(Math.random() * data.responses.length)];
              }
            }
            
            return germanResponses.default[Math.floor(Math.random() * germanResponses.default.length)];
          };

          const handleSubmit = () => {
            if (!input.trim() || loading) return;

            const userMessage = { role: 'user', content: input };
            setMessages(prev => [...prev, userMessage]);
            const currentInput = input;
            setInput('');
            setLoading(true);

            setTimeout(() => {
              const response = getResponse(currentInput);
              setMessages(prev => [...prev, {
                role: 'assistant',
                content: response
              }]);
              setLoading(false);
            }, 800);
          };

          const quickPhrases = [
            { german: 'Ich liebe dich', english: 'I love you' },
            { german: 'Wie geht\'s dir?', english: 'How are you?' },
            { german: 'Guten Morgen!', english: 'Good morning!' },
            { german: 'Was machst du?', english: 'What are you doing?' },
          ];

          return (
            <div className="min-h-screen bg-gradient-to-br from-pink-100 via-rose-100 to-purple-100 p-2 sm:p-4">
              <div className="max-w-4xl mx-auto h-screen flex flex-col">
                <div className="bg-white/80 backdrop-blur-lg rounded-3xl p-4 sm:p-6 mb-2 sm:mb-4 border-2 border-pink-200 shadow-lg">
                  <div className="flex items-center justify-center gap-2 sm:gap-3 mb-1 sm:mb-2">
                    <Heart className="w-6 h-6 sm:w-8 sm:h-8 text-pink-500 fill-pink-500" />
                    <h1 className="text-xl sm:text-3xl font-bold bg-gradient-to-r from-pink-500 via-rose-500 to-purple-500 text-transparent bg-clip-text">
                      German Learning Bot
                    </h1>
                    <Sparkles className="w-6 h-6 sm:w-8 sm:h-8 text-purple-500" />
                  </div>
                  <p className="text-rose-600 text-center text-xs sm:text-sm font-medium">Learn German with love 💕</p>
                </div>

                <div className="bg-white/90 backdrop-blur-lg rounded-3xl border-2 border-pink-200 shadow-xl overflow-hidden flex-1 flex flex-col">
                  <div className="flex-1 overflow-y-auto p-3 sm:p-6 space-y-3 sm:space-y-4 bg-gradient-to-b from-pink-50/30 to-purple-50/30">
                    {messages.map((msg, idx) => (
                      <div
                        key={idx}
                        className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                      >
                        <div
                          className={`max-w-[85%] sm:max-w-xs lg:max-w-md px-4 sm:px-5 py-2.5 sm:py-3 rounded-3xl shadow-md ${
                            msg.role === 'user'
                              ? 'bg-gradient-to-r from-pink-400 to-rose-400 text-white'
                              : 'bg-white text-gray-800 border-2 border-pink-200'
                          }`}
                        >
                          <p className="text-xs sm:text-sm leading-relaxed whitespace-pre-wrap break-words">{msg.content}</p>
                        </div>
                      </div>
                    ))}
                    {loading && (
                      <div className="flex justify-start">
                        <div className="bg-white text-gray-800 border-2 border-pink-200 px-5 py-3 rounded-3xl shadow-md">
                          <div className="flex gap-1">
                            <div className="w-2 h-2 bg-pink-400 rounded-full animate-bounce"></div>
                            <div className="w-2 h-2 bg-rose-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                            <div className="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                          </div>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  <div className="px-3 sm:px-6 py-3 sm:py-4 bg-gradient-to-r from-pink-50 to-purple-50 border-t-2 border-pink-200">
                    <p className="text-xs text-rose-600 font-medium mb-2 flex items-center gap-1">
                      <Star className="w-3 h-3 fill-rose-400" />
                      Try these:
                    </p>
                    <div className="flex flex-wrap gap-1.5 sm:gap-2">
                      {quickPhrases.map((phrase, idx) => (
                        <button
                          key={idx}
                          onClick={() => setInput(phrase.german)}
                          className="text-xs px-3 sm:px-4 py-1.5 sm:py-2 bg-white hover:bg-pink-100 active:bg-pink-200 text-rose-600 rounded-full border-2 border-pink-200 transition-all shadow-sm hover:shadow-md font-medium touch-manipulation"
                          title={phrase.english}
                        >
                          {phrase.german}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="p-3 sm:p-6 bg-gradient-to-r from-pink-50 to-purple-50 border-t-2 border-pink-200">
                    <div className="flex gap-2 sm:gap-3">
                      <input
                        type="text"
                        value={input}
                        onChange={(e) => setInput(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            handleSubmit();
                          }
                        }}
                        placeholder="Type here... 💕"
                        className="flex-1 px-4 sm:px-5 py-2.5 sm:py-3 text-sm sm:text-base bg-white border-2 border-pink-200 rounded-full text-gray-800 placeholder-rose-300 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-pink-400 shadow-sm"
                        disabled={loading}
                      />
                      <button
                        onClick={handleSubmit}
                        disabled={loading || !input.trim()}
                        className="px-4 sm:px-6 py-2.5 sm:py-3 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 active:from-pink-600 active:to-rose-600 text-white rounded-full font-medium disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md hover:shadow-lg flex items-center gap-2 touch-manipulation"
                      >
                        <Send className="w-4 h-4 sm:w-5 sm:h-5" />
                      </button>
                    </div>
                  </div>
                </div>

                <div className="mt-2 sm:mt-4 text-center text-rose-600 text-xs sm:text-sm font-medium pb-2">
                  <p className="flex items-center justify-center gap-1 sm:gap-2">
                    <Heart className="w-3 h-3 sm:w-4 sm:h-4 fill-pink-400" />
                    Made with love
                    <Heart className="w-3 h-3 sm:w-4 sm:h-4 fill-pink-400" />
                  </p>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GermanLearningBot />);
    </script>
</body>
</html>
